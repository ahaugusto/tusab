#
# Categorização das notas geradas automaticamente pelo GitHub (botão "Generate
# release notes"). O corpo das releases da extensão sai de docs-site/docs/changelog.md
# (workflow release.yml).

changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Dependências
      labels: [dependencies]
    - title: Extensão
      labels: [extensao]
    - title: Tela
      labels: [frontend]
    - title: CI/Infra
      labels: [ci]
    - title: Outros
      labels: ["*"]
