#
# Auto-merge condicional de PRs do Dependabot: só patch, nunca minor/major.
# `gh pr merge --auto` espera os status checks obrigatórios de main (Extensão nos
# três sistemas e Tela) antes de
# mesclar. main também exige branch atualizado (strict: true) — e o
# auto-merge nativo não atualiza o branch sozinho; quem faz isso é
# dependabot-update-branch.yml (fila serial). Uma versão anterior deste
# comentário dizia que main não tinha proteção nenhuma: estava errado
# (consulta à API de proteção feita com a conta sem permissão de admin
# devolvia 404, lido como "sem regra").
#
# NÃO adicionar um step de "aprovar automaticamente" (gh pr review --approve):
# GITHUB_TOKEN nunca pode aprovar PR, em nenhuma configuração — é restrição
# de identidade do GitHub (o ator github-actions[bot] não pode se
# auto-aprovar), não uma questão de permissão do workflow. Uma versão
# anterior deste arquivo tinha esse step antes do merge condicional; ele
# falhava sempre (GraphQL: "GitHub Actions is not permitted to approve pull
# requests"), o que interrompia o job ANTES do step de merge — resultado:
# nenhum PR do Dependabot foi mesclado automaticamente entre 03/ago e
# 02/set/2026, apesar do workflow "existir". Ver histórico interno do projeto.
#
# Trigger é `pull_request` comum, não `pull_request_target` — PRs abertos
# pelo Dependabot já rodam com GITHUB_TOKEN somente leitura por padrão do
# GitHub (mudança de 2021), e o merge aqui usa apenas permissão de escrita
# em PR/conteúdo, nunca secrets de build. `pull_request_target` rodaria com
# o contexto do branch base mesmo pra PR externo — desnecessário e pior
# postura de segurança pra este caso.
#
# Até a 2.0.0 o diretório electron/ (instalador desktop) ficava fora do auto-merge; o desktop
# foi descontinuado e o código saiu do repositório (etiqueta desktop-final).

name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Metadados do Dependabot
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Habilitar auto-merge (somente patch)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
