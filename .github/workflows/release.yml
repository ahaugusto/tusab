# Release pipeline: builda o instalador Windows e publica como GitHub Release
# Acionado por push de tag vX.Y.Z (ex: git tag v1.2.0 && git push --tags)

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Gatilho manual — só existe pra validar o job `tests` isoladamente (ex: depois
  # de trocar/registrar um runner self-hosted novo) sem precisar publicar uma
  # tag de verdade. build-windows/build-macos ficam com `if: github.event_name
  # == 'push'` propositalmente — nunca rodam (nem builda, nem publica nada) num
  # disparo manual.
  workflow_dispatch: {}

jobs:
  # ── 1. Testes antes de qualquer build ────────────────────────────────────────
  tests:
    name: Testes (pytest + vite)
    # Voltou pro ubuntu-latest hospedado em 2026-08-06 — o bloqueio de billing
    # ("recent account payments have failed or your spending limit needs to
    # be increased", ativo desde meados de 2026) não reproduz mais, validado
    # via workflow_dispatch (run 31139474481, verde em 5m34s). Mais barato e
    # rápido que qualquer runner self-hosted; não depende de nenhum Mac físico.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest hospedado: actions/setup-python funciona normalmente aqui
      # (o bug de permissão RUNNER_TOOL_CACHE era específico do self-hosted
      # macOS — ver histórico do arquivo). Sem download manual de Python.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Dist mínimo para testes
        run: |
          mkdir -p web_interface/dist/assets
          echo '<!doctype html><html><body>Tusab CI</body></html>' > web_interface/dist/index.html

      - name: Pytest
        run: python -m pytest tests/ -v --tb=short

      - name: Build frontend
        working-directory: web_interface
        run: npm install && npx vite build

  # ── 2. Build do instalador Windows ───────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'push'   # nunca builda/publica em disparo manual de teste
    permissions:
      contents: write   # necessário para publicar a release em ahaugusto/tusab

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      # Extrai a versão da tag (v1.2.0 → 1.2.0) e atualiza package.json do Electron
      - name: Sincronizar versão do package.json com a tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Versão: $VERSION"
          cd electron
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # Build do frontend (dist/ que vai dentro do instalador)
      - name: Build frontend
        working-directory: web_interface
        run: npm install && npx vite build

      # Instala dependências do Electron
      - name: Instalar dependências Electron
        working-directory: electron
        run: npm ci

      # Extrai a seção do CHANGELOG.md da versão atual pra usar como corpo da
      # release (releaseInfo.releaseNotesFile em electron/package.json) — sem
      # isso a release fica com corpo vazio (aconteceu na v1.0.41, publicada
      # sem nenhuma nota nem instrução de instalação pro macOS).
      - name: Gerar notas de release a partir do CHANGELOG.md
        shell: bash
        run: node scripts/generate-release-notes.js "${GITHUB_REF_NAME#v}"

      # credentials.json (OAuth do Google Drive) nunca foi commitado — só existia
      # localmente na máquina onde builds eram feitos manualmente. Builds via CI
      # (aqui e no job build-macos) sempre saíram sem esse arquivo, ou seja, sem
      # sincronização com o Drive funcionando no instalador. Ver agents/macos.md.
      - name: Escrever credentials.json (OAuth Google Drive) a partir do secret
        shell: bash
        run: echo '${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}' > credentials.json

      # electron-builder lê GH_TOKEN para publicar na release.
      # [CONTRATO] publish.owner/repo em electron/package.json aponta para
      # ahaugusto/tusab-public — repositório DIFERENTE de onde este workflow
      # roda (ahaugusto/tusab). O GITHUB_TOKEN automático do Actions só tem
      # permissão no repo local (ahaugusto/tusab); publicar em outro repo
      # exige um Personal Access Token com escopo `repo`, salvo como o
      # secret RELEASE_PAT (Settings → Secrets and variables → Actions).
      # Causa raiz de todas as releases v1.0.23–v1.0.37 terem sido feitas
      # manualmente: 403 "Resource not accessible by integration" com
      # GITHUB_TOKEN — ver run 28401557076 (v1.0.22, 29/jun/2026).
      - name: Build e publicar instalador
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: npm run build -- --publish always

  # ── 3. Build do instalador macOS (.dmg + .zip, assinado e notarizado) ───────
  build-macos:
    name: Build macOS (.dmg + .zip)
    # Self-hosted (Scaleway Mac mini) — evita consumir a cota gratuita do
    # macos-latest hospedado (ver macos-smoke.yml, job electron-notarize).
    runs-on: [self-hosted, macOS, ARM64]
    needs: tests
    if: github.event_name == 'push'   # nunca builda/publica em disparo manual de teste
    # Assinatura sozinha (deep-sign de todo o python_env com torch/
    # onnxruntime/transformers) já passa de 30min — notarização soma
    # submissão + espera da Apple em cima disso. Medido na prática
    # (self-hosted, Mac mini M1-M): 90min não foi suficiente.
    timeout-minutes: 180
    permissions:
      contents: write   # necessário para publicar a release em ahaugusto/tusab-public

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      - name: Sincronizar versão do package.json com a tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Versão: $VERSION"
          cd electron
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # Python portátil (equivalente macOS do python_env embeddable do Windows)
      # — mesmo par release/versão usado no macos-smoke.yml (Fases 1-7).
      - name: Baixar Python portátil (cpython 3.12.13, arm64)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p electron/python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C electron/python_env-macos-arm64 --strip-components=1

      - name: Instalar dependências Python
        run: |
          ./electron/python_env-macos-arm64/bin/python3 -m pip install --upgrade pip
          ./electron/python_env-macos-arm64/bin/python3 -m pip install -r requirements.txt

      - name: Build frontend
        working-directory: web_interface
        run: npm install && npx vite build

      - name: Instalar dependências Electron
        working-directory: electron
        run: npm ci

      # credentials.json (OAuth do Google Drive) nunca foi commitado — builds
      # via CI sempre saíram sem esse arquivo, ou seja, sem sincronização com
      # o Drive funcionando no instalador. Mesmo passo em build-windows.
      - name: Escrever credentials.json (OAuth Google Drive) a partir do secret
        run: echo '${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}' > credentials.json

      # APPLE_API_KEY precisa ser um caminho de arquivo .p8 — o secret guarda
      # o conteúdo (ver macos-smoke.yml, job electron-notarize).
      - name: Preparar API Key da App Store Connect (arquivo .p8)
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          echo "${{ secrets.APPLE_API_KEY }}" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Runner self-hosted roda sem sessão GUI (só SSH) — o keychain de login
      # não pode ser desbloqueado/importado programaticamente nesse contexto.
      # Mesma causa raiz e fix aplicados em macos-smoke.yml (job
      # electron-notarize) — ver comentário lá e agents/macos.md.
      - name: Preparar keychain de assinatura (self-hosted, sem sessão GUI)
        run: |
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db

          echo "${{ secrets.CSC_LINK }}" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/cert.p12

          curl -sL -o /tmp/DeveloperIDG2CA.cer "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
          curl -sL -o /tmp/AppleRootCA.cer "https://www.apple.com/appleca/AppleIncRootCertificate.cer"
          security import /tmp/DeveloperIDG2CA.cer -k build.keychain -T /usr/bin/codesign -T /usr/bin/security
          security import /tmp/AppleRootCA.cer -k build.keychain -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain
          security find-identity -v -p codesigning build.keychain

      # Mesma extração do job build-windows — os dois jobs publicam na MESMA
      # release (tusab-public), então geramos as notas idênticas aqui também
      # (não depende de qual job termina primeiro).
      - name: Gerar notas de release a partir do CHANGELOG.md
        run: node scripts/generate-release-notes.js "${GITHUB_REF_NAME#v}"

      # electron-builder notariza e grampeia (staple) o ticket automaticamente
      # com base no mac.notarize do package.json + os 3 env vars da API Key,
      # depois publica na release. CSC_LINK/CSC_KEY_PASSWORD não são passados
      # aqui — o certificado já está no keychain (passo anterior).
      - name: Build, assinar, notarizar e publicar (.dmg + .zip)
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Sem isso, o publisher do electron-builder recusa anexar os
          # artefatos a uma release já existente com mais de 2h (guard interno
          # dele, ver gitHubPublisher.ts — pensado pra evitar sobrescrever uma
          # release "definitiva" antiga por engano). A release do Windows é
          # criada bem antes da notarização do Mac terminar (notarização real
          # leva 90-180min), então esse guard sempre disparava aqui — build,
          # assinatura e notarização terminavam OK mas o upload era pulado em
          # silêncio (exit code 0, log só mostra "skipped publishing").
          EP_GH_IGNORE_TIME: "true"
        # ulimit padrão do runner (256) é baixo demais pra assinar cada um dos
        # milhares de arquivos dentro de python_env (torch/onnxruntime/
        # transformers) — sem isso, EMFILE: too many open files. 10240 ainda
        # não foi suficiente num teste real; 65536 confirmado necessário.
        run: |
          sudo sysctl -w kern.maxfilesperproc=200000 kern.maxfiles=300000
          ulimit -n 100000
          npm run build:mac:publish -- -c.mac.notarize=true

      - name: Remover keychain efêmero de assinatura
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain build.keychain 2>/dev/null || true

  # ── TESTE — cross-build ARM64 a partir de hardware Intel ────────────────────
  # Hipótese: build-macos exige runner ARM64 só por causa de UMA etapa (baixar
  # e EXECUTAR um Python compilado pra aarch64 pra rodar pip install) — o
  # resto do pipeline (electron-builder empacotando o target arm64, codesign,
  # notarização via upload) não executa código ARM64, só manipula os binários
  # como arquivo. Se isso for confirmado, o Mac Intel self-hosted passa a
  # servir pro build de verdade, não só pra QA manual. Job temporário, só
  # roda em disparo manual — remover/promover pra build-macos depois de
  # validado. Sem assinatura/notarização/publish aqui de propósito (barato
  # e rápido de iterar; assinatura real fica pra quando isso já funcionar).
  test-cross-build-arm64:
    name: "[TESTE] Cross-build ARM64 a partir de Intel"
    runs-on: [self-hosted, macOS, X64]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      # Extração de tar é arch-agnóstica — só a EXECUÇÃO de um binário arm64
      # falharia num host Intel. Isso aqui é seguro.
      - name: Baixar Python portátil ARM64 (só extração)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p electron/python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C electron/python_env-macos-arm64 --strip-components=1

      # pip install --platform/--python-version/--abi busca e extrai wheels
      # de OUTRA plataforma sem precisar executar o interpretador alvo —
      # usa o Python do próprio runner (Intel) só como ferramenta de
      # download+extração de pacote, nunca importa/executa o código baixado.
      # macosx_14_0 (não 11/12/13) é a tag mínima que o torch>=2.12.1 publica
      # pra arm64 — descoberto neste teste (ver CHANGELOG).
      - name: Instalar dependências ARM64 via pip download (sem executar interpretador ARM64)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            --target electron/python_env-macos-arm64/lib/python3.12/site-packages \
            --platform macosx_14_0_arm64 \
            --python-version 3.12 \
            --implementation cp \
            --abi cp312 \
            --only-binary=:all: \
            -r requirements.txt

      - name: Verificar arquitetura dos binários instalados
        run: |
          file electron/python_env-macos-arm64/bin/python3
          find electron/python_env-macos-arm64/lib/python3.12/site-packages -name "*.so" | head -5 | xargs file

      - name: Build frontend
        working-directory: web_interface
        run: npm install && npx vite build

      - name: Instalar dependências Electron
        working-directory: electron
        run: npm ci

      # electron-builder lê esse arquivo pra gerar o update-info (latest-mac.yml)
      # mesmo com --publish never — mesmo passo do build-macos real, versão dummy
      # aqui já que não estamos numa tag de verdade.
      - name: Gerar release_notes.md dummy (só pra não quebrar o update-info)
        run: echo "# Teste de cross-build — sem conteúdo real" > release_notes.md

      # Sem assinatura (identity=null) e sem publish — só valida que o
      # electron-builder consegue MONTAR o .app arm64 rodando em host Intel.
      - name: Empacotar ARM64 sem assinar/notarizar/publicar
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --arm64 --publish never -c.mac.notarize=false

      - name: Verificar arquitetura do binário Electron gerado
        run: |
          echo "Conteúdo de dist_electron/:"
          find dist_electron -maxdepth 2
          APP_BIN=$(find dist_electron -name "Tusab" -path "*.app/Contents/MacOS/*" | head -1)
          echo "Binário: $APP_BIN"
          file "$APP_BIN"
          PY_BIN="electron/python_env-macos-arm64/bin/python3"
          echo "Python embutido: $PY_BIN"
          file "$PY_BIN"
          if ! file "$APP_BIN" | grep -q "arm64"; then
            echo "::error::Binário Electron NÃO é arm64!"
            exit 1
          fi
          if ! file "$PY_BIN" | grep -q "arm64"; then
            echo "::error::Python embutido NÃO é arm64!"
            exit 1
          fi
          echo "Confirmado: binário Electron e Python embutido são ambos arm64."
