# Release da extensão: ao criar a etiqueta vX.Y.Z (a mesma versão do tusab-mcp/package.json),
# roda os testes, gera o pacote .mcpb com os avisos de licença, assina (quando o certificado
# estiver configurado), calcula a soma SHA-256 e publica a release no GitHub SEM marcá-la
# como "mais recente" (decisão do Augusto, 19/11/2026: a marca é dada à mão depois do teste
# no Claude Desktop). As notas saem da entrada da versão em docs-site/docs/changelog.md.
#
# Como publicar uma versão:
#   1. subir a versão em tusab-mcp/package.json e manifest.json (o teste confere que batem),
#      escrever a entrada no changelog e trocar o link de download nas páginas de instalação;
#   2. juntar o PR na main;
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Assinatura (opcional até existir certificado): segredos MCPB_CERTIFICADO e MCPB_CHAVE (PEM,
# certificado de assinatura de código) e, se a autoridade exigir, MCPB_INTERMEDIARIOS (PEM, um
# ou mais certificados concatenados). Sem eles o pacote sai sem assinatura, como hoje.

name: Release da extensão

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Gerar e publicar o .mcpb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            web_interface/package-lock.json
            tusab-mcp/package-lock.json

      - name: Conferir versão, changelog e link de download
        id: versao
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          PKG=$(node -p "require('./tusab-mcp/package.json').version")
          MAN=$(node -p "require('./tusab-mcp/manifest.json').version")
          [ "$V" = "$PKG" ] && [ "$V" = "$MAN" ] || { echo "::error::Etiqueta $TAG, package.json $PKG, manifest.json $MAN: precisam ser iguais."; exit 1; }
          grep -q "^\*\*v$V " docs-site/docs/changelog.md || { echo "::error::Falta a entrada **v$V (...)** em docs-site/docs/changelog.md."; exit 1; }
          for f in docs-site/docs/instalacao.md docs-site/i18n/en/docusaurus-plugin-content-docs/current/instalacao.md; do
            grep -q "releases/download/$TAG/tusab-$V.mcpb" "$f" || { echo "::error::$f não aponta para releases/download/$TAG/tusab-$V.mcpb."; exit 1; }
          done
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: |
          npm ci --prefix web_interface
          npm ci --prefix tusab-mcp

      - name: Testes da extensão
        working-directory: tusab-mcp
        run: npm test

      - name: Gerar o pacote (tela + avisos de licença + .mcpb)
        working-directory: tusab-mcp
        run: |
          npm run pack
          test -f interface/index.html
          for f in LICENSE TRADEMARK.md THIRD_PARTY_NOTICES.txt icon.png; do test -s "$f" || { echo "::error::Falta $f no pacote."; exit 1; }; done
          mv ../tusab.mcpb "../tusab-${{ steps.versao.outputs.v }}.mcpb"

      - name: Assinar o pacote (quando o certificado estiver configurado)
        env:
          CERT: ${{ secrets.MCPB_CERTIFICADO }}
          CHAVE: ${{ secrets.MCPB_CHAVE }}
          INTERMEDIARIOS: ${{ secrets.MCPB_INTERMEDIARIOS }}
        run: |
          ARQ="tusab-${{ steps.versao.outputs.v }}.mcpb"
          if [ -z "$CERT" ] || [ -z "$CHAVE" ]; then
            echo "Sem certificado configurado: o pacote sai sem assinatura."
            exit 0
          fi
          umask 077
          printf '%s\n' "$CERT" > "$RUNNER_TEMP/cert.pem"
          printf '%s\n' "$CHAVE" > "$RUNNER_TEMP/key.pem"
          EXTRA=()
          if [ -n "$INTERMEDIARIOS" ]; then
            printf '%s\n' "$INTERMEDIARIOS" > "$RUNNER_TEMP/intermediarios.pem"
            EXTRA=(--intermediate "$RUNNER_TEMP/intermediarios.pem")
          fi
          npx --yes @anthropic-ai/mcpb@2.1.2 sign "$ARQ" --cert "$RUNNER_TEMP/cert.pem" --key "$RUNNER_TEMP/key.pem" "${EXTRA[@]}"
          rm -f "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/intermediarios.pem"
          # O "mcpb verify" 2.1.2 diz "não assinado" mesmo em pacote assinado (testado em 19/11/2026);
          # por isso a conferência é a do bloco de assinatura no fim do arquivo.
          tail -c 65536 "$ARQ" | grep -q 'MCPB_SIG_END' || { echo "::error::O pacote não ficou assinado."; exit 1; }

      - name: Soma de verificação (SHA-256)
        run: |
          ARQ="tusab-${{ steps.versao.outputs.v }}.mcpb"
          sha256sum "$ARQ" > "$ARQ.sha256"
          cat "$ARQ.sha256"
          npx --yes @anthropic-ai/mcpb@2.1.2 info "$ARQ"

      - name: Notas da release (changelog + soma)
        run: |
          V="${{ steps.versao.outputs.v }}"
          awk -v v="**v$V " 'index($0, v) == 1 {on=1} on && /^(\*\*v|## )/ && index($0, v) != 1 {exit} on {print}' docs-site/docs/changelog.md > notas.md
          {
            echo
            echo "## Instalar"
            echo
            echo "Baixe \`tusab-$V.mcpb\` abaixo e abra o arquivo com o Claude Desktop instalado. Passo a passo: https://criaugu.github.io/tusab/instalacao"
            echo
            echo "SHA-256 (\`tusab-$V.mcpb\`): \`$(cut -d' ' -f1 "tusab-$V.mcpb.sha256")\`"
          } >> notas.md
          cat notas.md

      - name: Publicar a release (sem marcar como a mais recente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.versao.outputs.v }}"
          gh release create "$GITHUB_REF_NAME" "tusab-$V.mcpb" "tusab-$V.mcpb.sha256" \
            --title "Tusab $V" --notes-file notas.md --latest=false --verify-tag
