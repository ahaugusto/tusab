# Fases 1-4 do suporte a macOS — cada job isola uma variável nova antes da
# próxima entrar em cena (ver plano aprovado em
# C:\Users\augus\.claude\plans\no-git-j-estamos-binary-wilkinson.md).

name: macOS Smoke

on:
  workflow_dispatch:
    inputs:
      only_job:
        description: "ID do job a rodar sozinho (vazio = roda todos). Ex: ollama-autoinstall"
        required: false
        default: ''

jobs:
  # ── Fase 1: o runner responde e é a arquitetura certa? ─────────────────────
  runner-check:
    name: "Fase 1: Verificar runner macOS"
    runs-on: macos-latest
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'runner-check' }}
    steps:
      - name: Versão do macOS
        run: sw_vers

      - name: Arquitetura
        run: uname -m

      - name: Versão do Python do sistema
        run: python3 --version

      - name: Versão do Node do sistema
        run: node --version

  # ── Fase 2: as libs pesadas instalam num Python portátil macOS? ────────────
  python-portatil:
    name: "Fase 2: Python portátil + dependências"
    runs-on: macos-latest
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'python-portatil' }}
    steps:
      - uses: actions/checkout@v7

      # python-build-standalone (astral-sh) — equivalente conceitual do Python
      # "embeddable" já usado no Windows: build relocável, extraível em
      # qualquer pasta, sem instalação no sistema. 3.12.13 em vez de 3.12.10
      # (usado no Windows) porque o release mais recente do projeto não mantém
      # mais o patch exato 3.12.10 disponível — mesma minor, patch mais novo,
      # sem risco de comportamento pras dependências do Tusab.
      - name: Baixar Python portátil (cpython 3.12.13, arm64)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C python_env-macos-arm64 --strip-components=1
          ./python_env-macos-arm64/bin/python3 --version

      - name: Instalar dependências (requirements.txt)
        run: |
          ./python_env-macos-arm64/bin/python3 -m pip install --upgrade pip
          ./python_env-macos-arm64/bin/python3 -m pip install -r requirements.txt

      - name: Smoke de import das libs críticas
        run: |
          ./python_env-macos-arm64/bin/python3 -c "
          import fastapi, uvicorn, sentence_transformers, torch, cryptography
          import rapidocr_onnxruntime, pandas, reportlab, trafilatura, yt_dlp
          print('Import OK — todas as libs críticas carregaram sem erro')
          "

      - name: Gerar lock de dependências (pip freeze)
        run: ./python_env-macos-arm64/bin/python3 -m pip freeze > requirements-lock-macos-arm64.txt

      - name: Publicar lock como artifact
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock-macos-arm64
          path: requirements-lock-macos-arm64.txt
          retention-days: 14

  # ── Fase 3: o Electron sobe o backend real e responde HTTP? (--dir, sem instalador) ──
  electron-dir:
    name: "Fase 3: Electron real (--dir, sem instalador)"
    runs-on: macos-latest
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'electron-dir' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      # Python portátil vai direto em electron/python_env-macos-arm64 — é de
      # lá que electron/package.json (build.mac.extraResources) lê o "from".
      - name: Baixar Python portátil (cpython 3.12.13, arm64)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p electron/python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C electron/python_env-macos-arm64 --strip-components=1
          ./electron/python_env-macos-arm64/bin/python3 --version

      - name: Instalar dependências Python
        run: |
          ./electron/python_env-macos-arm64/bin/python3 -m pip install --upgrade pip
          ./electron/python_env-macos-arm64/bin/python3 -m pip install -r requirements.txt

      - name: Build do frontend
        working-directory: web_interface
        run: npm install && npx vite build

      - name: Instalar dependências do Electron
        working-directory: electron
        run: npm ci

      - name: Build Electron (--mac --dir)
        working-directory: electron
        run: npm run build:mac:dir

      - name: Rodar o app empacotado e aguardar o backend responder
        env:
          # Isola o teste do backend Python — sem isso o app tentaria baixar
          # e instalar o Ollama (branch darwin nunca testado, rede + escrita
          # em /Applications) junto com o que este smoke quer validar.
          TUSAB_SMOKE_TEST: '1'
        run: |
          # directories.output em package.json é "../dist_electron", relativo
          # à pasta electron/ (onde o package.json mora) — resolve pra
          # dist_electron/ na RAIZ do repo, não dentro de electron/.
          APP_BIN=$(find dist_electron -path "*.app/Contents/MacOS/Tusab" | head -1)
          echo "Binário encontrado: $APP_BIN"
          if [ -z "$APP_BIN" ]; then
            echo "Binário do app não encontrado — conteúdo de dist_electron:"
            find dist_electron -maxdepth 3
            exit 1
          fi

          # nohup + disown: sem isso o processo em background morre quando o
          # shell deste step termina, e os steps seguintes (que rodam num
          # shell novo) não acham mais nada escutando na porta 8001.
          nohup "$APP_BIN" > app.log 2>&1 &
          APP_PID=$!
          disown
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8001/status > /dev/null 2>&1; then
              ok=1
              echo "Backend respondeu após ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "=== app.log (backend nunca respondeu) ==="
            cat app.log
            exit 1
          fi

      # Mesmos asserts do smoke.ps1 (suíte minor): /status, /repositorio,
      # /queue e /queue/add checam conteúdo do corpo; /history e /agent/status
      # no smoke.ps1 só checam HTTP 200 (curl -sf já falha em não-2xx).
      - name: Smoke HTTP
        run: |
          set -e
          check() {
            local path="$1" expect="$2" body
            body=$(curl -sf "http://127.0.0.1:8001$path")
            if [ -n "$expect" ] && ! echo "$body" | grep -Eq "$expect"; then
              echo "FALHOU: $path — esperado conter '$expect', recebido: $body"
              exit 1
            fi
            echo "OK: $path"
          }
          check_post() {
            local path="$1" payload="$2" expect="$3" body
            body=$(curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "http://127.0.0.1:8001$path")
            if ! echo "$body" | grep -Eq "$expect"; then
              echo "FALHOU: POST $path — esperado conter '$expect', recebido: $body"
              exit 1
            fi
            echo "OK: POST $path"
          }

          check "/status" '"is_running"'
          check "/history" ""
          check "/repositorio" '"youtube"'
          check "/queue" '"queue"'
          check_post "/queue/add" '{"canal_url":"https://www.youtube.com/@investidorsardinha","fontes":[]}' '"ok":true'
          check "/agent/status" ""

      - name: Confirmar diretório de dados resolvido (app.getPath('userData'))
        run: |
          if [ -d "$HOME/Library/Application Support/Tusab" ]; then
            echo "OK: dados gravados em $HOME/Library/Application Support/Tusab"
            find "$HOME/Library/Application Support/Tusab" -maxdepth 2
          else
            echo "AVISO: pasta de dados esperada não encontrada — pode indicar problema em TUSAB_DATA_DIR"
          fi

      - name: Encerrar o app
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true

      - name: Publicar log do app (sempre, ajuda a depurar mesmo em sucesso)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-app-log
          path: app.log
          retention-days: 14

  # ── Fase 4: empacota .dmg + .zip de verdade (ainda sem assinar) ────────────
  # .zip é obrigatório pro MacUpdater funcionar — o .dmg sozinho só serve pra
  # instalação manual inicial, não pro mecanismo de auto-update em background.
  electron-dmg:
    name: "Fase 4: Empacotar .dmg + .zip (sem assinatura)"
    runs-on: macos-latest
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'electron-dmg' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      - name: Baixar Python portátil (cpython 3.12.13, arm64)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p electron/python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C electron/python_env-macos-arm64 --strip-components=1
          ./electron/python_env-macos-arm64/bin/python3 --version

      - name: Instalar dependências Python
        run: |
          ./electron/python_env-macos-arm64/bin/python3 -m pip install --upgrade pip
          ./electron/python_env-macos-arm64/bin/python3 -m pip install -r requirements.txt

      - name: Build do frontend
        working-directory: web_interface
        run: npm install && npx vite build

      - name: Instalar dependências do Electron
        working-directory: electron
        run: npm ci

      # Sem CSC_LINK/CSC_KEY_PASSWORD nos secrets (Fase 5 ainda não aconteceu),
      # o electron-builder empacota sem assinar — esperado nesta fase.
      - name: Build Electron (--mac, gera .dmg + .zip)
        working-directory: electron
        run: npm run build:mac

      - name: Listar artefatos gerados
        run: |
          find dist_electron -maxdepth 1 -name "*.dmg" -o -maxdepth 1 -name "*.zip" | tee artefatos.txt
          if [ ! -s artefatos.txt ]; then
            echo "Nenhum .dmg/.zip encontrado — conteúdo de dist_electron:"
            find dist_electron -maxdepth 2
            exit 1
          fi

      - name: Montar o .dmg (hdiutil attach) e rodar o app de dentro do volume
        env:
          TUSAB_SMOKE_TEST: '1'
        run: |
          DMG=$(find dist_electron -maxdepth 1 -name "*.dmg" | head -1)
          echo "DMG: $DMG"
          MOUNT_OUT=$(hdiutil attach "$DMG" -nobrowse -noautoopen)
          echo "$MOUNT_OUT"
          MOUNT_POINT=$(echo "$MOUNT_OUT" | grep -oE "/Volumes/[^ ]+.*" | tail -1)
          echo "MOUNT_POINT=$MOUNT_POINT" >> "$GITHUB_ENV"
          echo "Montado em: $MOUNT_POINT"

          APP_BIN=$(find "$MOUNT_POINT" -maxdepth 4 -path "*.app/Contents/MacOS/Tusab" | head -1)
          echo "Binário: $APP_BIN"
          if [ -z "$APP_BIN" ]; then
            echo "Binário não encontrado dentro do volume montado:"
            find "$MOUNT_POINT" -maxdepth 3
            exit 1
          fi

          nohup "$APP_BIN" > app-dmg.log 2>&1 &
          APP_PID=$!
          disown
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8001/status > /dev/null 2>&1; then
              ok=1
              echo "Backend respondeu após ${i}s (rodando direto do .dmg montado)"
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "=== app-dmg.log (backend nunca respondeu) ==="
            cat app-dmg.log
            exit 1
          fi

      - name: Smoke HTTP (a partir do .dmg montado)
        run: |
          set -e
          check() {
            local path="$1" expect="$2" body
            body=$(curl -sf "http://127.0.0.1:8001$path")
            if [ -n "$expect" ] && ! echo "$body" | grep -Eq "$expect"; then
              echo "FALHOU: $path — esperado conter '$expect', recebido: $body"
              exit 1
            fi
            echo "OK: $path"
          }
          check "/status" '"is_running"'
          check "/repositorio" '"youtube"'
          check "/queue" '"queue"'

      - name: Encerrar o app e desmontar o .dmg
        if: always()
        run: |
          kill "$APP_PID" 2>/dev/null || true
          sleep 1
          hdiutil detach "$MOUNT_POINT" 2>/dev/null || true

      - name: Publicar .dmg/.zip como artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-mac-unsigned
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar log do app rodando via .dmg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-app-dmg-log
          path: app-dmg.log
          retention-days: 14
          if-no-files-found: warn

  # ── Fase 6: assina de verdade (sem notarizar ainda) ─────────────────────────
  # Usa os secrets CSC_LINK/CSC_KEY_PASSWORD (Developer ID Application .p12,
  # gerado na Fase 5). electron-builder detecta esses 2 env vars sozinho, sem
  # precisar de config adicional em package.json além de hardenedRuntime +
  # entitlements (já configurados). Verifica a assinatura ANTES de gastar uma
  # tentativa de notarização (Fase 7, minutos + cota limitada) num problema
  # que na real seria só de entitlement/assinatura.
  electron-sign:
    name: "Fase 6: Assinatura local (Developer ID, sem notarizar)"
    runs-on: macos-latest
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'electron-sign' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      - name: Baixar Python portátil (cpython 3.12.13, arm64)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p electron/python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C electron/python_env-macos-arm64 --strip-components=1

      - name: Instalar dependências Python
        run: |
          ./electron/python_env-macos-arm64/bin/python3 -m pip install --upgrade pip
          ./electron/python_env-macos-arm64/bin/python3 -m pip install -r requirements.txt

      - name: Build do frontend
        working-directory: web_interface
        run: npm install && npx vite build

      - name: Instalar dependências do Electron
        working-directory: electron
        run: npm ci

      - name: Build Electron assinado (--mac, gera .dmg + .zip)
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        # ulimit padrão do runner (256) é baixo demais pra assinar cada um dos
        # milhares de arquivos dentro de python_env (torch/onnxruntime/
        # transformers) — sem isso, EMFILE: too many open files.
        run: |
          echo "ulimit -Hn (hard limit): $(ulimit -Hn)"
          sudo sysctl -w kern.maxfilesperproc=200000 kern.maxfiles=300000
          ulimit -n 100000
          npm run build:mac

      - name: Localizar o .app gerado
        run: |
          APP_PATH=$(find dist_electron -maxdepth 2 -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "App encontrado: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Nenhum .app encontrado — conteúdo de dist_electron:"
            find dist_electron -maxdepth 3
            exit 1
          fi

      - name: "codesign --verify no .app (deep)"
        run: |
          codesign --verify --deep --strict --verbose=4 "$APP_PATH" 2>&1

      - name: "codesign --verify em cada binário Mach-O do python_env"
        run: |
          set +e
          FAIL=0
          # find todo arquivo que o `file` identifica como Mach-O (executável ou .so/.dylib)
          while IFS= read -r -d '' bin; do
            if file "$bin" | grep -q "Mach-O"; then
              if ! codesign --verify --strict "$bin" > /tmp/codesign_out.txt 2>&1; then
                echo "FALHOU: $bin"
                cat /tmp/codesign_out.txt
                FAIL=1
              fi
            fi
          done < <(find "$APP_PATH/Contents/Resources/python_env" -type f -print0)
          if [ "$FAIL" = "1" ]; then
            echo "=== Um ou mais binários do python_env falharam na verificação de assinatura ==="
            exit 1
          fi
          echo "OK: todos os binários Mach-O do python_env verificados"

      - name: Rodar o app assinado e confirmar que ainda funciona (Hardened Runtime não quebrou nada)
        env:
          TUSAB_SMOKE_TEST: '1'
        run: |
          BIN="$APP_PATH/Contents/MacOS/Tusab"
          nohup "$BIN" > app-signed.log 2>&1 &
          APP_PID=$!
          disown
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8001/status > /dev/null 2>&1; then
              ok=1
              echo "Backend respondeu após ${i}s rodando assinado sob Hardened Runtime"
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "=== app-signed.log ==="
            cat app-signed.log
            exit 1
          fi

      - name: Smoke HTTP (app assinado)
        run: |
          set -e
          curl -sf "http://127.0.0.1:8001/status" | grep -q '"is_running"' && echo "OK: /status"
          curl -sf "http://127.0.0.1:8001/repositorio" | grep -q '"youtube"' && echo "OK: /repositorio"

      - name: Encerrar o app
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true

      - name: Publicar .dmg/.zip assinados como artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-mac-signed
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar log do app assinado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-app-signed-log
          path: app-signed.log
          retention-days: 14
          if-no-files-found: warn

  # ── Fase 7: notariza de verdade ──────────────────────────────────────────────
  # electron-builder chama @electron/notarize sozinho quando mac.notarize está
  # configurado (package.json) — só precisa dos 3 env vars da App Store Connect
  # API Key. IMPORTANTE: APPLE_API_KEY precisa ser um CAMINHO de arquivo .p8,
  # não o conteúdo — o secret guarda o conteúdo, então esse job escreve num
  # arquivo antes do build. Stapling do ticket é automático após notarizar com
  # sucesso (comportamento padrão do @electron/notarize).
  electron-notarize:
    name: "Fase 7: Notarização real"
    # Self-hosted (Scaleway Mac mini) — evita consumir a cota gratuita do
    # macos-latest hospedado, que já foi motivo de bloqueio nesta sessão.
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'electron-notarize' }}
    # Assinatura sozinha (Fase 6) já passa de 30min com o python_env inteiro
    # (torch/onnxruntime/transformers) — notarização soma submissão +
    # espera da Apple em cima disso. Medido na prática (self-hosted, Mac
    # mini M1-M): 90min NÃO foi suficiente, job foi cancelado pelo próprio
    # timeout do GitHub Actions ainda no meio da assinatura/notarização.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      - name: Baixar Python portátil (cpython 3.12.13, arm64)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p electron/python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C electron/python_env-macos-arm64 --strip-components=1

      - name: Instalar dependências Python
        run: |
          ./electron/python_env-macos-arm64/bin/python3 -m pip install --upgrade pip
          ./electron/python_env-macos-arm64/bin/python3 -m pip install -r requirements.txt

      - name: Build do frontend
        working-directory: web_interface
        run: npm install && npx vite build

      - name: Instalar dependências do Electron
        working-directory: electron
        run: npm ci

      - name: Preparar API Key da App Store Connect (arquivo .p8)
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"
          echo "${{ secrets.APPLE_API_KEY }}" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Runner self-hosted roda sem sessão GUI (só SSH) — o keychain de login
      # não pode ser desbloqueado/importado programaticamente nesse contexto
      # ("SecKeychainItemImport: User interaction is not allowed"), o que faz
      # o electron-builder cair silenciosamente pra assinatura ad-hoc em vez
      # de falhar. Fix: keychain efêmero próprio, desbloqueado sem prompt,
      # com a cadeia de confiança completa da Apple (o cert líder sozinho não
      # basta — sem a CA intermediária "Developer ID" instalada, o macOS não
      # confia nele e `security find-identity` retorna 0 identidades válidas
      # mesmo com o cert já importado). Descoberto e validado por SSH direto
      # no runner antes de codificar aqui — ver agents/macos.md.
      - name: Preparar keychain de assinatura (self-hosted, sem sessão GUI)
        run: |
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security delete-keychain build.keychain 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASS" build.keychain
          security list-keychains -d user -s build.keychain login.keychain-db

          echo "${{ secrets.CSC_LINK }}" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "${{ secrets.CSC_KEY_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/cert.p12

          curl -sL -o /tmp/DeveloperIDG2CA.cer "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
          curl -sL -o /tmp/AppleRootCA.cer "https://www.apple.com/appleca/AppleIncRootCertificate.cer"
          security import /tmp/DeveloperIDG2CA.cer -k build.keychain -T /usr/bin/codesign -T /usr/bin/security
          security import /tmp/AppleRootCA.cer -k build.keychain -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain
          echo "Identidades válidas após montar a cadeia de confiança:"
          security find-identity -v -p codesigning build.keychain

      - name: Build Electron assinado + notarizado (--mac)
        working-directory: electron
        env:
          # CSC_LINK/CSC_KEY_PASSWORD NÃO são passados aqui de propósito — o
          # certificado já está no keychain (passo anterior); passar de novo
          # faz o electron-builder tentar reimportar sozinho e reproduzir o
          # mesmo erro de sessão. CSC_IDENTITY_AUTO_DISCOVERY (default true)
          # encontra a identidade já presente no keychain search list.
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # mac.notarize é false no package.json (padrão da Fase 6/8, sem
        # notarizar) — override via CLI só aqui, onde as credenciais da Apple
        # API Key realmente estão disponíveis.
        run: |
          echo "ulimit -Hn (hard limit): $(ulimit -Hn)"
          sudo sysctl -w kern.maxfilesperproc=200000 kern.maxfiles=300000
          ulimit -n 100000
          npm run build:mac -- -c.mac.notarize=true

      - name: Localizar o .app gerado
        run: |
          APP_PATH=$(find dist_electron -maxdepth 2 -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          if [ -z "$APP_PATH" ]; then
            echo "Nenhum .app encontrado:"; find dist_electron -maxdepth 3; exit 1
          fi

      - name: "Verificar via spctl (Gatekeeper) — precisa vir 'accepted, source=Notarized Developer ID'"
        run: |
          spctl -a -vvv --type execute "$APP_PATH" 2>&1 | tee /tmp/spctl_out.txt
          grep -q "accepted" /tmp/spctl_out.txt
          grep -q "Notarized Developer ID" /tmp/spctl_out.txt

      - name: Verificar stapling do ticket
        run: |
          xcrun stapler validate "$APP_PATH" 2>&1

      - name: Rodar o app notarizado e confirmar que ainda funciona
        env:
          TUSAB_SMOKE_TEST: '1'
        run: |
          BIN="$APP_PATH/Contents/MacOS/Tusab"
          nohup "$BIN" > app-notarized.log 2>&1 &
          APP_PID=$!
          disown
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8001/status > /dev/null 2>&1; then
              ok=1; echo "Backend respondeu após ${i}s"; break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "=== app-notarized.log ==="; cat app-notarized.log; exit 1
          fi
          curl -sf "http://127.0.0.1:8001/status" | grep -q '"is_running"' && echo "OK: /status"

      - name: Encerrar o app
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true

      - name: Remover keychain efêmero de assinatura
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain build.keychain 2>/dev/null || true

      - name: Publicar .dmg/.zip notarizados como artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-mac-notarized
          path: |
            dist_electron/*.dmg
            dist_electron/*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-app-notarized-log
          path: app-notarized.log
          retention-days: 14
          if-no-files-found: warn

  # ── Validação extra: safeStorage/Keychain funciona de verdade no macOS? ────
  # Levantamento apontava isso como "portável no papel" (API do próprio
  # Electron) mas nunca exercitado neste projeto em macOS real. Roda o
  # primitivo exato usado por get/set/delete-api-key em main.js, sem precisar
  # subir o app inteiro.
  keychain-safestorage:
    name: "Validação: safeStorage roundtrip no Keychain real"
    runs-on: macos-latest
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'keychain-safestorage' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Instalar dependências do Electron
        working-directory: electron
        run: npm ci

      - name: Roundtrip encryptString/decryptString via Keychain
        working-directory: electron
        run: |
          cat > test-safestorage.js << 'EOF'
          const { app, safeStorage } = require('electron')
          app.whenReady().then(() => {
            const available = safeStorage.isEncryptionAvailable()
            console.log('isEncryptionAvailable:', available)
            if (!available) {
              console.log('RESULT: UNAVAILABLE — Keychain não acessível neste runner')
              app.exit(1)
              return
            }
            const original = 'teste-tusab-chave-123'
            const enc = safeStorage.encryptString(original)
            const dec = safeStorage.decryptString(enc)
            const ok = dec === original
            console.log('roundtrip:', ok ? 'OK' : 'FALHOU')
            console.log('RESULT:', ok ? 'OK' : 'FAIL')
            app.exit(ok ? 0 : 1)
          })
          EOF
          npx electron test-safestorage.js

  # ── Validação extra: auto-instalação do Ollama funciona de verdade? ────────
  # findOllamaExe() tinha um bug real (corrigido nesta sessão): o fallback
  # 'ollama' era retornado incondicionalmente (sempre truthy), então
  # ensureOllama() achava que o Ollama já estava instalado mesmo quando não
  # estava — o download/instalação nunca disparava. No Windows isso ficava
  # mascarado porque o instalador NSIS já oferece instalar o Ollama antes do
  # primeiro launch; no macOS, sem instalador equivalente, ensureOllama() é o
  # ÚNICO mecanismo — por isso essa validação roda num runner limpo, sem
  # Ollama pré-instalado, exercitando o fluxo real de download do .zip do
  # GitHub + extração + mv para /Applications.
  ollama-autoinstall:
    name: "Validação: auto-instalação real do Ollama"
    runs-on: macos-latest
    if: ${{ github.event.inputs.only_job == '' || github.event.inputs.only_job == 'ollama-autoinstall' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_interface/package-lock.json

      - name: Baixar Python portátil (cpython 3.12.13, arm64)
        run: |
          curl -L -o python-macos-arm64.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-aarch64-apple-darwin-install_only.tar.gz"
          mkdir -p electron/python_env-macos-arm64
          tar -xzf python-macos-arm64.tar.gz -C electron/python_env-macos-arm64 --strip-components=1

      - name: Instalar dependências Python
        run: |
          ./electron/python_env-macos-arm64/bin/python3 -m pip install --upgrade pip
          ./electron/python_env-macos-arm64/bin/python3 -m pip install -r requirements.txt

      - name: Build do frontend
        working-directory: web_interface
        run: npm install && npx vite build

      - name: Instalar dependências do Electron
        working-directory: electron
        run: npm ci

      - name: Build Electron (--mac --dir)
        working-directory: electron
        run: npm run build:mac:dir

      - name: Confirmar que este runner não tem Ollama pré-instalado
        run: |
          if [ -d "/Applications/Ollama.app" ]; then
            echo "AVISO: Ollama.app já existe neste runner — validação não é limpa"
          else
            echo "OK: runner limpo, sem Ollama.app"
          fi

      # SEM TUSAB_SMOKE_TEST — deixa ensureOllama() rodar de verdade.
      - name: Rodar o app (ensureOllama real, sem guard de smoke test)
        run: |
          APP_BIN=$(find dist_electron -path "*.app/Contents/MacOS/Tusab" | head -1)
          echo "Binário: $APP_BIN"
          nohup "$APP_BIN" > app-ollama.log 2>&1 &
          APP_PID=$!
          disown
          echo "APP_PID=$APP_PID" >> "$GITHUB_ENV"

          echo "Aguardando o backend (não deve ser bloqueado pelo fluxo do Ollama)..."
          ok=0
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8001/status > /dev/null 2>&1; then
              ok=1
              echo "Backend respondeu após ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "=== app-ollama.log ==="
            cat app-ollama.log
            exit 1
          fi

      - name: Aguardar instalação + inicialização real do Ollama (até 10min)
        run: |
          ok=0
          for i in $(seq 1 600); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              ok=1
              echo "Ollama respondeu em http://127.0.0.1:11434 após ${i}s"
              break
            fi
            sleep 1
          done

          echo "=== Estado final ==="
          if [ -d "/Applications/Ollama.app" ]; then
            echo "OK: /Applications/Ollama.app foi criado"
          else
            echo "FALHOU: /Applications/Ollama.app não existe"
          fi

          if [ "$ok" = "1" ]; then
            echo "OK: servidor Ollama respondendo em :11434"
          else
            echo "FALHOU: servidor Ollama nunca respondeu em :11434"
          fi

          echo "=== app-ollama.log (completo) ==="
          cat app-ollama.log

          if [ ! -d "/Applications/Ollama.app" ] || [ "$ok" != "1" ]; then
            exit 1
          fi

      - name: Encerrar o app
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true

      - name: Publicar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tusab-ollama-autoinstall-log
          path: app-ollama.log
          retention-days: 14
          if-no-files-found: warn
