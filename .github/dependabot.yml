#
# Atualização automática de dependências, um PR por atualização — nunca em
# lote. Lição da rodada manual de update de stacks (jul/2026, ver
# histórico interno do projeto): atualizar várias dependências de uma vez pode
# quebrar travas transitivas não óbvias (ex: protobuf/typer/mpmath/setuptools
# quebraram juntos ao atualizar um grupo "de baixo risco"). PRs individuais,
# cada um testado isoladamente pelo ci.yml existente, evitam esse tipo de
# quebra em cascata e tornam o "culpado" óbvio quando algo falha.

version: 2
updates:
  # Extensão (servidor MCP, tusab-mcp/)
  - package-ecosystem: "npm"
    directory: "/tusab-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "extensao"]
    commit-message:
      prefix: "chore(deps)"

  # Tela (React/Vite, compilada para dentro do pacote da extensão)
  - package-ecosystem: "npm"
    directory: "/web_interface"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
    # Tailwind 3→4 é migração planejada e deliberada (ver Roadmap.md, P0-h)
    # — nunca via PR automático de patch/minor de rotina.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # GitHub Actions em si (actions/checkout, actions/setup-python, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
